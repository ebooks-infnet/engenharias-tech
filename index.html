        function highlightText(text, search) {
            if (!text || !search || !search.trim()) return text;
            const escapedSearch = search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedSearch})`, 'gi');
            return text.replace(regex, `<mark class="bg-yellow-200 text-black px-0.5 rounded font-semibold">$1</mark>`);
        }

        function renderFormattedText(text, search, isTitle = false) {
            if (!text) return '';
            
            let sanitized = text.replace(/\[a href="([^"]+)"\](.*?)\[\/a\]/g, '$2');
            
            const boldParts = sanitized.split('**');
            let resultHTML = '';
            
            boldParts.forEach((part, index) => {
                const isBold = index % 2 === 1;
                const content = highlightText(part, search);
                if (isBold) {
                    const boldClass = isTitle ? "font-black text-[#689ccb]" : "font-extrabold text-inherit";
                    resultHTML += `<strong class="${boldClass}">${content}</strong>`;
                } else {
                    resultHTML += `<span>${content}</span>`;
                }
            });
            return resultHTML;
        }

            }

            if (paragraph.startsWith('## ')) {
                return `<h3 class="text-xl md:text-2xl font-black mt-8 mb-4 p-3 rounded-xl bg-sky-50 dark:bg-sky-950/40 text-sky-800 dark:text-sky-300 border-l-4 border-sky-500 shadow-sm flex items-center tracking-tight">
                    ${renderFormattedText(paragraph.replace('## ', ''), state.searchQuery, true)}
                </h3>`;
            }
            if (paragraph.startsWith('### ')) {
                return `<h4 class="text-lg md:text-xl font-bold mt-6 mb-3 text-[#23599c] dark:text-[#689ccb]">
                    ${renderFormattedText(paragraph.replace('### ', ''), state.searchQuery, true)}
                </h4>`;
            }
            if (paragraph.startsWith('- ') || paragraph.startsWith('• ')) {
                return `<li class="ml-5 list-disc mb-2 pl-2 leading-relaxed">
                    ${renderFormattedText(paragraph.replace(/^[-•]\s*/, ''), state.searchQuery, false)}
                </li>`;
            }
            if (/^\d+\.\s/.test(paragraph)) {
                return `<p class="ml-2 mb-3 leading-relaxed font-semibold text-slate-800 dark:text-slate-200">
                    ${renderFormattedText(paragraph, state.searchQuery, false)}
                </p>`;
            }

            return `<p class="mb-4 text-justify leading-relaxed">${renderFormattedText(paragraph, state.searchQuery, false)}</p>`;
        }

        function renderContent() {
            const container = document.getElementById('scroll-container');
            if (!container) return;

            if (state.currentChapterIndex === -1) {
                let coverHTML = `
                <div class="relative flex flex-col items-center justify-between text-center min-h-[75vh] py-12 px-6 rounded-3xl border border-dashed border-white/20 bg-[#013056] text-white overflow-hidden shadow-2xl">
                    
                    <div class="flex flex-col items-center my-auto space-y-6 max-w-2xl pt-8">
                        <div class="mb-2">
                            <img src="https://faculdadeinfnet.com.br/wp-content/uploads/sites/10/2023/08/Artboard-2.png" alt="Logo Instituto Infnet" class="h-20 object-contain" />
                        </div>

                        <h1 class="text-4xl sm:text-5xl md:text-6xl font-black tracking-tight leading-tight text-white drop-shadow-sm">
                            <span class="block">E-book</span>
                            <span class="block text-[#689ccb]">Engenharias Tech</span>
                        </h1>
                        
                        <p class="text-base sm:text-lg md:text-xl text-white font-medium leading-relaxed max-w-xl">
                            Construindo o Futuro da Tecnologia: O guia definitivo para entender, projetar e liderar as Engenharias Tech.
                        </p>

                        <div class="pt-6">
                            <button onclick="setChapter(0)" class="px-8 py-4 bg-[#23599c] hover:bg-[#1a4478] active:scale-95 text-white font-black text-sm rounded-2xl shadow-lg hover:shadow-[#23599c]/25 transition-all flex items-center space-x-3 mx-auto">
                                <span>ABRIR E-BOOK INTERATIVO</span>
                                <svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="w-full mt-12 pt-8 border-t border-white/15">
                        <h3 class="text-sm font-black uppercase tracking-widest text-center text-[#689ccb] drop-shadow-sm mb-6">
                            Índice Geral de Conteúdo (Parte 1)
                        </h3>
                        
                        <div class="w-full max-w-3xl mx-auto space-y-2.5 text-left">
                `;

                ebookData.forEach((chap, idx) => {
                    coverHTML += `
                        <button onclick="setChapter(${idx})" class="w-full p-4 border border-white/20 rounded-xl bg-white/5 hover:bg-white/15 text-left transition-all text-white font-semibold whitespace-normal break-words leading-relaxed text-sm block shadow-sm hover:border-[#689ccb]/50">
                            ${chap.title}
                        </button>
                    `;
                });

                coverHTML += `
                        </div>
                    </div>
                </div>
                `;

                container.innerHTML = coverHTML;
                return;
            }

            const article = ebookData[state.currentChapterIndex];
            const fontClasses = {
                small: 'text-xs md:text-sm leading-relaxed',
                normal: 'text-sm md:text-base leading-relaxed',
                large: 'text-lg md:text-xl leading-relaxed',
                xl: 'text-xl md:text-2xl leading-relaxed'
            };

            let paragraphsHTML = '';
            article.content.forEach((paragraph, pIdx) => {
                paragraphsHTML += renderParagraphHTML(paragraph, pIdx === 0);
            });

            const articleHTML = `
            <article class="space-y-6 ${fontClasses[state.fontSize]}">
                <header class="space-y-2 pb-6 border-b border-current opacity-80">
                   <div class="text-xs font-bold text-[#23599c] dark:text-[#689ccb] tracking-wider uppercase flex items-center space-x-2">
                     <span>${article.pageRange}</span>
                   </div>
                   <h2 class="text-2xl sm:text-3xl font-black leading-tight">
                        ${renderFormattedText(article.title, state.searchQuery, true)}
                   </h2>
                </header>

                <div class="space-y-4">
                    ${paragraphsHTML}
                </div>

                <div class="p-4 flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-current opacity-60 text-xs font-bold mt-10">
                    <button onclick="setChapter(${state.currentChapterIndex - 1})" class="w-full sm:w-auto px-4 py-2 border rounded-lg hover:bg-black/5 dark:hover:bg-white/5 text-center transition-all flex items-center justify-center space-x-2 ${state.currentChapterIndex === 0 ? 'opacity-30 pointer-events-none' : ''}">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                        <span>Anterior</span>
                    </button>

                    <button onclick="setChapter(-1)" class="w-full sm:w-auto px-4 py-2 border rounded-lg hover:bg-black/5 dark:hover:bg-white/5 text-center transition-all">
                        Ir para a Capa
                    </button>

                    ${state.currentChapterIndex < ebookData.length - 1 ? `
                        <button onclick="setChapter(${state.currentChapterIndex + 1})" class="w-full sm:w-auto px-4 py-2 border rounded-lg hover:bg-black/5 dark:hover:bg-white/5 text-center transition-all flex items-center justify-center space-x-2">
                            <span>Próximo</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                            </svg>
                        </button>
                    ` : '<div></div>'}
                </div>
            </article>
            `;

            container.innerHTML = articleHTML;
        }

        function handleSearch(query) {
            state.searchQuery = query.trim();
            renderSearchPanel();
            if (state.currentChapterIndex !== -1) {
                renderContent();
            }
        }

        function renderSearchPanel() {
            const query = state.searchQuery.toLowerCase();
            const resultsContent = document.getElementById('search-results-content');
            const resultsInfo = document.getElementById('search-results-info');
            if (!resultsContent) return;

            if (!query) {
                if (resultsInfo) resultsInfo.classList.add('hidden');
                resultsContent.innerHTML = `<p class="text-xs text-center opacity-60 py-6">Digite um termo para pesquisar em todo o e-book...</p>`;
                return;
            }

            let matches = [];
            ebookData.forEach((chapter, chapterIndex) => {
                chapter.content.forEach((paragraph, pIndex) => {
                    if (paragraph.toLowerCase().includes(query)) {
                        matches.push({ chapter, chapterIndex, paragraph, pIndex });
                    }
                });
            });

            if (resultsInfo) {
                resultsInfo.innerText = `${matches.length} trecho(s) encontrado(s)`;
                resultsInfo.classList.remove('hidden');
            }

            if (matches.length === 0) {
                resultsContent.innerHTML = `<p class="text-xs text-center opacity-60 py-6">Nenhum resultado encontrado para "${state.searchQuery}".</p>`;
                return;
            }

            let html = '';
            matches.slice(0, 30).forEach(match => {
                const cleanParagraph = match.paragraph.replace(/^[#\-•\d\.]+\s*/, '');
                html += `
                    <div onclick="setChapter(${match.chapterIndex}); closePanels();" class="p-3 border rounded-lg hover:bg-sky-50 dark:hover:bg-sky-950/40 cursor-pointer transition-all border-slate-200 dark:border-slate-700">
                        <div class="text-[10px] font-bold text-[#23599c] dark:text-[#689ccb] uppercase tracking-wider mb-1">
                            Capítulo ${match.chapterIndex + 1}
                        </div>
                        <div class="text-xs font-bold mb-1 truncate">
                            ${match.chapter.title}
                        </div>
                        <div class="text-[11px] opacity-80 line-clamp-3">
                            ${highlightText(cleanParagraph, state.searchQuery)}
                        </div>
                    </div>
                `;
            });

            resultsContent.innerHTML = html;
        }

        function renderBookmarksPanel() {
            const container = document.getElementById('bookmarks-panel-content');
            if (!container) return;

            if (state.bookmarks.length === 0) {
                container.innerHTML = `<p class="text-xs text-center opacity-60 py-6">Nenhum capítulo favoritado ainda.</p>`;
                return;
            }

            let html = '';
            state.bookmarks.forEach(id => {
                const chapterIdx = ebookData.findIndex(c => c.id === id);
                if (chapterIdx !== -1) {
                    const chapter = ebookData[chapterIdx];
                    html += `
                        <div class="p-3 border rounded-lg flex items-center justify-between hover:bg-sky-50 dark:hover:bg-sky-950/40 transition-all border-slate-200 dark:border-slate-700">
                            <button onclick="setChapter(${chapterIdx}); closePanels();" class="text-left flex-1 pr-2">
                                <div class="text-[10px] font-bold text-[#23599c] dark:text-[#689ccb] uppercase">Capítulo ${chapterIdx + 1}</div>
                                <div class="text-xs font-bold truncate">${chapter.title}</div>
                            </button>
                            <button onclick="toggleBookmarkById(${id})" class="p-1.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-lg transition-all" title="Remover dos favoritos">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                                </svg>
                            </button>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
        }

        function toggleBookmarkById(id) {
            const idx = state.bookmarks.indexOf(id);
            if (idx !== -1) {
                state.bookmarks.splice(idx, 1);
                saveBookmarks();
                updateHeaderBookmarkIcon();
                renderBookmarksPanel();
            }
        }

        // Fechar painéis ao clicar fora
        document.addEventListener('click', (e) => {
            const searchPanel = document.getElementById('search-panel');
            const bookmarksPanel = document.getElementById('bookmarks-panel');
            const btnSearch = document.getElementById('tab-btn-search');
            const btnBookmarks = document.getElementById('tab-btn-bookmarks');

            if (state.activePanel) {
                const clickedInsideSearch = searchPanel && searchPanel.contains(e.target);
                const clickedInsideBookmarks = bookmarksPanel && bookmarksPanel.contains(e.target);
                const clickedBtnSearch = btnSearch && btnSearch.contains(e.target);
                const clickedBtnBookmarks = btnBookmarks && btnBookmarks.contains(e.target);

                if (!clickedInsideSearch && !clickedInsideBookmarks && !clickedBtnSearch && !clickedBtnBookmarks) {
                    closePanels();
                }
            }
        });

        // Fechar painéis com a tecla ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closePanels();
            }
        });

        // Inicialização da aplicação
        window.addEventListener('DOMContentLoaded', () => {
            loadBookmarks();
            setChapter(-1);
        });
    </script>
</body>
</html>
